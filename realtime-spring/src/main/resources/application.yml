server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: realtime-spring
  datasource:
    url: jdbc:h2:mem:candles;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:spring-websocket-candles}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  kafka:
    topic-candles-btc: ${KAFKA_TOPIC_CANDLES_BTC:candles-btc}
    topic-candles-gold: ${KAFKA_TOPIC_CANDLES_GOLD:candles-gold}
  websocket:
    path: /ws
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.aitrading.realtime: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
