---
- name: Base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - git
      - fontconfig
      - "{{ jenkins_java_package }}"
      - apt-transport-https
    state: present
    update_cache: true

- name: Include Jenkins tasks
  ansible.builtin.import_tasks: jenkins.yml

- name: Mark Ansible Jenkins setup complete
  ansible.builtin.copy:
    dest: /var/log/ansible-jenkins-setup.done
    content: "completed at {{ ansible_date_time.iso8601 }}\n"
    mode: "0644"

- name: Wait for Jenkins HTTP on port 8080
  ansible.builtin.wait_for:
    port: 8080
    host: 127.0.0.1
    delay: 5
    timeout: 300

- name: Show unlock password hint
  ansible.builtin.debug:
    msg: "Unlock: sudo cat /var/lib/jenkins/secrets/initialAdminPassword"
