---
- name: Install CI tools (Docker, AWS CLI, kubectl, Helm)
  ansible.builtin.apt:
    name:
      - docker.io
      - awscli
      - unzip
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add jenkins user to docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify: Restart jenkins

- name: Install kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ jenkins_kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Download Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ jenkins_helm_version }}-linux-amd64.tar.gz"
    dest: /tmp/helm-linux-amd64.tar.gz
    mode: "0644"

- name: Extract Helm binary
  ansible.builtin.unarchive:
    src: /tmp/helm-linux-amd64.tar.gz
    dest: /tmp/helm-extract
    remote_src: true
    creates: /tmp/helm-extract/linux-amd64/helm

- name: Place helm binary on PATH
  ansible.builtin.copy:
    src: /tmp/helm-extract/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true

- name: Verify docker access for jenkins user
  ansible.builtin.command: docker info
  become: true
  become_user: jenkins
  changed_when: false

- name: Verify AWS CLI identity (instance profile)
  ansible.builtin.command: aws sts get-caller-identity
  become: true
  become_user: jenkins
  changed_when: false
  failed_when: false
  register: jenkins_aws_identity

- name: Show AWS identity when available
  ansible.builtin.debug:
    var: jenkins_aws_identity.stdout_lines
  when: jenkins_aws_identity.rc == 0
