---
# Ubuntu 24.04 (Noble) has no apt package "awscli" — use AWS CLI v2 installer.

- name: Install Docker, jq, and unzip
  ansible.builtin.apt:
    name:
      - docker.io
      - jq
      - unzip
    state: present
    update_cache: true

- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
    mode: "0644"

- name: Install AWS CLI v2
  ansible.builtin.shell: |
    set -euo pipefail
    rm -rf /tmp/awscliv2
    unzip -q /tmp/awscliv2.zip -d /tmp/awscliv2
    /tmp/awscliv2/aws/install --update
  args:
    executable: /bin/bash
    creates: /usr/local/bin/aws

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add jenkins user to docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify: Restart jenkins

- name: Install kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ jenkins_kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Download Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ jenkins_helm_version }}-linux-amd64.tar.gz"
    dest: /tmp/helm-linux-amd64.tar.gz
    mode: "0644"

- name: Ensure Helm extract directory exists
  ansible.builtin.file:
    path: /tmp/helm-extract
    state: directory
    mode: "0755"

- name: Extract Helm binary
  ansible.builtin.unarchive:
    src: /tmp/helm-linux-amd64.tar.gz
    dest: /tmp/helm-extract
    remote_src: true
    creates: /tmp/helm-extract/linux-amd64/helm

- name: Place helm binary on PATH
  ansible.builtin.copy:
    src: /tmp/helm-extract/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true

- name: Verify docker access for jenkins user
  ansible.builtin.command: runuser -u jenkins -- docker info
  changed_when: false

- name: Verify AWS CLI identity (instance profile)
  ansible.builtin.command: runuser -u jenkins -- aws sts get-caller-identity
  changed_when: false
  failed_when: false
  register: jenkins_aws_identity

- name: Show AWS identity when available
  ansible.builtin.debug:
    var: jenkins_aws_identity.stdout_lines
  when: jenkins_aws_identity.rc == 0
