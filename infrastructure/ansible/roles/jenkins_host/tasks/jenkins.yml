---
- name: Add Jenkins GPG key (2026 signing key)
  ansible.builtin.shell: |
    curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key | gpg --dearmor -o /usr/share/keyrings/jenkins-keyring.gpg
  args:
    creates: /usr/share/keyrings/jenkins-keyring.gpg

- name: Add Jenkins apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.gpg] https://pkg.jenkins.io/debian-stable binary/"
    filename: jenkins
    state: present

- name: Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true
  notify: Restart jenkins

- name: Set Java 21 as default if available
  ansible.builtin.shell: |
    JAVA21_HOME="/usr/lib/jvm/java-21-openjdk-{{ machine_arch }}"
    if [ -x "${JAVA21_HOME}/bin/java" ]; then
      update-alternatives --install /usr/bin/java java "${JAVA21_HOME}/bin/java" 2111 || true
      update-alternatives --set java "${JAVA21_HOME}/bin/java"
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Enable and start Jenkins
  ansible.builtin.systemd:
    name: jenkins
    enabled: true
    state: started
