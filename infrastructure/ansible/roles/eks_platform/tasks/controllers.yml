---
- name: Require ingress controller IAM when ingress is enabled
  ansible.builtin.assert:
    that:
      - alb_controller_role_arn | length > 0
      - external_dns_role_arn | length > 0
      - app_acm_certificate_arn | length > 0
      - api_acm_certificate_arn | length > 0
      - vpc_id | length > 0
    fail_msg: >-
      Set alb_controller_role_arn, external_dns_role_arn, app_acm_certificate_arn,
      api_acm_certificate_arn, and vpc_id in eks.yml (terraform output after apply).
  when: ingress_enabled | bool

- name: Add EKS Helm chart repo
  ansible.builtin.command:
    cmd: helm repo add eks https://aws.github.io/eks-charts
  register: helm_repo_eks
  changed_when: "'has been added' in helm_repo_eks.stdout"
  failed_when: helm_repo_eks.rc != 0 and 'already exists' not in (helm_repo_eks.stderr | default(''))
  when: ingress_enabled | bool

- name: Add external-dns Helm chart repo
  ansible.builtin.command:
    cmd: helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
  register: helm_repo_external_dns
  changed_when: "'has been added' in helm_repo_external_dns.stdout"
  failed_when: helm_repo_external_dns.rc != 0 and 'already exists' not in (helm_repo_external_dns.stderr | default(''))
  when: ingress_enabled | bool

- name: Update Helm repos
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false
  when: ingress_enabled | bool

- name: Install AWS Load Balancer Controller
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller
      --namespace kube-system
      --set clusterName={{ eks_cluster_name }}
      --set region={{ aws_region }}
      --set vpcId={{ vpc_id }}
      --set serviceAccount.create=true
      --set serviceAccount.name=aws-load-balancer-controller
      --set serviceAccount.annotations.eks\.amazonaws\.com/role-arn={{ alb_controller_role_arn }}
      --wait
      --timeout 10m
  register: alb_controller_helm
  changed_when: "'has been upgraded' in alb_controller_helm.stdout or 'deployed' in alb_controller_helm.stdout"
  when: ingress_enabled | bool

- name: Restart ALB controller after Helm upgrade (sync webhook TLS)
  ansible.builtin.command:
    cmd: kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system
  register: alb_controller_restart
  changed_when: alb_controller_restart.rc == 0
  when: ingress_enabled | bool

- name: Wait for ALB controller rollout
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=5m
  changed_when: false
  when: ingress_enabled | bool

- name: Install external-dns
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install external-dns external-dns/external-dns
      --namespace kube-system
      --set provider.name=aws
      --set policy=sync
      --set txtOwnerId={{ external_dns_txt_owner_id }}
      --set domainFilters[0]={{ external_dns_domain_filter }}
      --set serviceAccount.create=true
      --set serviceAccount.name=external-dns
      --set serviceAccount.annotations.eks\.amazonaws\.com/role-arn={{ external_dns_role_arn }}
      --wait
      --timeout 10m
  register: external_dns_helm
  changed_when: "'has been upgraded' in external_dns_helm.stdout or 'deployed' in external_dns_helm.stdout"
  when: ingress_enabled | bool
