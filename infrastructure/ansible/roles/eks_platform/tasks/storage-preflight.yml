---
# Ensure EBS volumes can provision before Helm deploy (gp2 → ebs.csi.aws.com on EKS 1.30+).
- name: Describe aws-ebs-csi-driver EKS add-on
  ansible.builtin.command:
    cmd: >-
      aws eks describe-addon
      --cluster-name {{ eks_cluster_name }}
      --addon-name aws-ebs-csi-driver
      --region {{ aws_region }}
      --query addon.status
      --output text
  register: ebs_addon_status
  changed_when: false
  failed_when: false
  when: ebs_csi_verify_enabled | bool

- name: Assert EBS CSI EKS add-on is ACTIVE
  ansible.builtin.assert:
    that:
      - ebs_addon_status.rc == 0
      - ebs_addon_status.stdout == "ACTIVE"
    fail_msg: >-
      aws-ebs-csi-driver add-on is not ACTIVE
      (status={{ ebs_addon_status.stdout | default('not installed') }}).
      Run: cd infrastructure/terraform/environments/dev && terraform apply
  when: ebs_csi_verify_enabled | bool

- name: List EBS CSI pods in kube-system
  ansible.builtin.command:
    cmd: >-
      kubectl get pods -n kube-system
      -l app.kubernetes.io/name=aws-ebs-csi-driver
      -o json
  register: ebs_csi_pods_json
  changed_when: false
  when: ebs_csi_verify_enabled | bool

- name: Assert at least one EBS CSI pod is Running
  ansible.builtin.assert:
    that:
      - >-
        (ebs_csi_pods_json.stdout | from_json).items
        | selectattr('status.phase', 'equalto', 'Running')
        | list | length > 0
    fail_msg: >-
      No Running aws-ebs-csi-driver pods in kube-system.
      Postgres/Kafka PVCs will stay Pending until the add-on is installed.
  when: ebs_csi_verify_enabled | bool
