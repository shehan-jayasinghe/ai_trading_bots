---
- name: Load platform secrets
  ansible.builtin.import_tasks: load-secrets.yml

- name: Require EKS secrets and image registry
  ansible.builtin.assert:
    that:
      - postgres_password | default('') | length > 0
      - auth_secret | default('') | length > 0
      - image_registry | length > 0
    fail_msg: >-
      Set platform_secret_id in eks.yml and populate AWS Secrets Manager
      (terraform output platform_secret_populate_command). Set image_registry in eks.yml
      (terraform output ecr_registry).

- name: Update kubeconfig for EKS cluster
  ansible.builtin.command:
    cmd: >-
      aws eks update-kubeconfig
      --region {{ aws_region }}
      --name {{ eks_cluster_name }}
  changed_when: false

- name: Verify EBS CSI driver (storage preflight)
  ansible.builtin.import_tasks: storage-preflight.yml

- name: Install EKS ingress controllers (ALB + external-dns)
  ansible.builtin.import_tasks: controllers.yml

- name: Build Helm dependencies (Bitnami subcharts)
  ansible.builtin.command:
    cmd: helm dependency update
    chdir: "{{ helm_chart_path }}"
  changed_when: false

- name: Ensure Helm namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ helm_namespace }}"

- name: Ensure application secret exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ app_secret_name }}"
        namespace: "{{ helm_namespace }}"
      type: Opaque
      stringData:
        POSTGRES_PASSWORD: "{{ postgres_password }}"
        postgres-password: "{{ postgres_password }}"
        AUTH_SECRET: "{{ auth_secret }}"
        OPENAI_API_KEY: "{{ openai_api_key | default('', true) }}"

- name: Deploy deriv-platform Helm release
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install {{ helm_release_name }} {{ helm_chart_path }}
      --namespace {{ helm_namespace }}
      {% for f in helm_values_files %}-f {{ helm_chart_path }}/{{ f }} {% endfor %}
      --set image.registry={{ image_registry }}
      --set image.tag={{ image_tag }}
      --set global.namespaceOverride={{ helm_namespace }}
      --set namespace.name={{ helm_namespace }}
      --set namespace.create=false
      --set secrets.existingSecret={{ app_secret_name }}
      --set postgresql.auth.existingSecret={{ app_secret_name }}
      --set global.postgresql.auth.password={{ postgres_password }}
      {% if ingress_enabled | bool %}
      --set-literal ingress.certificateArns={{ app_acm_certificate_arn }},{{ api_acm_certificate_arn }}
      --set ingress.hosts.app={{ app_domain }}
      --set ingress.hosts.api={{ api_domain }}
      --set frontend.env.NEXT_PUBLIC_BOT_BASE_URL=https://{{ api_domain }}
      {% endif %}
      --wait
      --timeout 20m
  register: helm_deploy
  changed_when: "'has been upgraded' in helm_deploy.stdout or 'deployed' in helm_deploy.stdout"

- name: Show platform PVCs
  ansible.builtin.command:
    cmd: kubectl get pvc -n {{ helm_namespace }}
  register: platform_pvcs
  changed_when: false

- name: Fail if any platform PVC is not Bound
  ansible.builtin.assert:
    that:
      - platform_pvcs.stdout is not search('Pending')
      - platform_pvcs.stdout is not search('<unset>')
    fail_msg: >-
      One or more PVCs in {{ helm_namespace }} are not Bound.
      Check: kubectl describe pvc -n {{ helm_namespace }}
      and: kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-ebs-csi-driver
  when: platform_pvcs.stdout_lines | length > 1

- name: Show platform pods
  ansible.builtin.command:
    cmd: kubectl get pods -n {{ helm_namespace }}
  changed_when: false
