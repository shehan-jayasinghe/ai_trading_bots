---
- name: Add Grafana Helm chart repo
  when: monitoring_enabled | default(true) | bool
  ansible.builtin.command:
    cmd: helm repo add grafana https://grafana.github.io/helm-charts
  register: helm_repo_grafana
  changed_when: "'has been added' in helm_repo_grafana.stdout"
  failed_when: helm_repo_grafana.rc != 0 and 'already exists' not in (helm_repo_grafana.stderr | default(''))

- name: Update Grafana Helm repo
  when: monitoring_enabled | default(true) | bool
  ansible.builtin.command:
    cmd: helm repo update grafana
  changed_when: false

- name: Ensure monitoring namespace exists
  when: monitoring_enabled | default(true) | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_namespace }}"

- name: Deploy monitoring stack via eks-monitoring.sh
  when: monitoring_enabled | default(true) | bool
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../../../jenkins/scripts/eks-monitoring.sh"
    chdir: "{{ playbook_dir }}/../../.."
  environment:
    AWS_REGION: "{{ aws_region }}"
    EKS_CLUSTER_NAME: "{{ eks_cluster_name }}"
    HELM_NAMESPACE: "{{ helm_namespace }}"
    MONITORING_NAMESPACE: "{{ monitoring_namespace }}"
    LOKI_S3_BUCKET: "{{ loki_s3_bucket | default('', true) }}"
    LOKI_ROLE_ARN: "{{ loki_role_arn | default('', true) }}"
    MONITORING_ENABLED: "{{ 'true' if monitoring_enabled | default(true) | bool else 'false' }}"
    GRAFANA_ADMIN_PASSWORD: "{{ grafana_admin_password | default('', true) }}"
  register: monitoring_deploy
  changed_when: "'Monitoring stack ready' in monitoring_deploy.stdout"
