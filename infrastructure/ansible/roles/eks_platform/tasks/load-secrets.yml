---
# Platform secrets: AWS Secrets Manager only (see platform_secret_id in eks.yml).

- name: Fetch platform secret JSON from Secrets Manager
  ansible.builtin.command:
    cmd: >-
      aws secretsmanager get-secret-value
      --region {{ aws_region }}
      --secret-id {{ platform_secret_id }}
      --query SecretString --output text
  register: platform_secret_raw
  changed_when: false
  no_log: true

- name: Parse platform secret fields
  ansible.builtin.set_fact:
    postgres_password: "{{ (platform_secret_raw.stdout | from_json).POSTGRES_PASSWORD | default('') }}"
    auth_secret: "{{ (platform_secret_raw.stdout | from_json).AUTH_SECRET | default('') }}"
    openai_api_key: "{{ (platform_secret_raw.stdout | from_json).OPENAI_API_KEY | default('') }}"
  no_log: true
