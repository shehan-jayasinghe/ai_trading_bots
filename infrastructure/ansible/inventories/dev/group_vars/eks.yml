---
# EKS platform deploy (dev). Set image_registry from: terraform output -raw ecr_registry

eks_cluster_name: deriv-ai-bot-dev
aws_region: us-west-1

# Fail deploy if EBS CSI add-on is missing (installed by Terraform aws_eks_addon.ebs_csi).
ebs_csi_verify_enabled: true

helm_release_name: deriv-platform
helm_namespace: deriv-dev
helm_chart_path: "{{ playbook_dir }}/../../../deploy/helm/deriv-platform"
helm_values_files:
  - values.yaml
  - values-dev.yaml

# ECR registry host only (no trailing slash)
image_registry: ""

image_tag: latest

app_secret_name: deriv-platform-app-secrets

# AWS Secrets Manager (preferred). Same secret Jenkins deploy reads.
platform_secret_id: deriv-ai-bot/dev/platform

postgresql_auth_username: deriv
postgresql_auth_database: deriv

# Public app/API (ACM + ALB ingress). Fill from terraform output.
ingress_enabled: true
app_domain: app.testenvlab.shop
api_domain: api.testenvlab.shop
vpc_id: vpc-0c167ee93964632d7
alb_controller_role_arn: arn:aws:iam::891377245316:role/deriv-ai-bot-dev-aws-lb-controller
external_dns_role_arn: arn:aws:iam::891377245316:role/deriv-ai-bot-dev-external-dns
app_acm_certificate_arn: arn:aws:acm:us-west-1:891377245316:certificate/4eedcfe4-eb5d-4dc7-b117-5d8ba38ea839
api_acm_certificate_arn: arn:aws:acm:us-west-1:891377245316:certificate/72d1612c-82f7-4875-947e-2ad0244dd0ac
external_dns_domain_filter: testenvlab.shop
external_dns_txt_owner_id: deriv-dev

# Monitoring (terraform output loki_s3_bucket, loki_role_arn)
monitoring_enabled: true
monitoring_namespace: monitoring
loki_s3_bucket: ""
loki_role_arn: ""
