---
# EKS platform deploy (dev). Set image_registry from: terraform output -json ecr_repository_urls

eks_cluster_name: deriv-ai-bot-dev
aws_region: us-west-1

helm_release_name: deriv-platform
helm_namespace: deriv-dev
helm_chart_path: "{{ playbook_dir }}/../../../deploy/helm/deriv-platform"
helm_values_files:
  - values.yaml
  - values-dev.yaml

# ECR registry host only (no trailing slash), e.g. 123456789012.dkr.ecr.us-west-1.amazonaws.com
image_registry: ""

image_tag: latest

app_secret_name: deriv-platform-app-secrets

postgresql_auth_username: deriv
postgresql_auth_database: deriv

# Public app/API (ACM + ALB ingress). Fill from: cd infrastructure/terraform/environments/dev && terraform output
ingress_enabled: true
app_domain: app.testenvlab.shop
api_domain: api.testenvlab.shop
vpc_id: ""
alb_controller_role_arn: ""
external_dns_role_arn: ""
app_acm_certificate_arn: ""
api_acm_certificate_arn: ""
external_dns_domain_filter: testenvlab.shop
external_dns_txt_owner_id: deriv-dev
