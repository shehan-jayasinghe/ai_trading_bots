---
# Deploy Postgres, Kafka, backend, workers, and frontend (ALB ingress) to EKS (dev).
#
# Prerequisites:
#   - terraform apply (EKS + ECR + Secrets Manager platform secret)
#   - aws secretsmanager put-secret-value (see: terraform output platform_secret_populate_command)
#   - docker images pushed to ECR
#   - set image_registry + IRSA ARNs in inventories/dev/group_vars/eks.yml
#
# Usage:
#   export AWS_PROFILE=default
#   ansible-playbook playbooks/eks-platform.yml -vv

- name: Deploy deriv platform to EKS
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/eks.yml

  roles:
    - eks_platform
