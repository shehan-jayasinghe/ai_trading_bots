---
# Print Jenkins initial admin unlock password from EC2.
# Usage:
#   export JENKINS_SSH_KEY=~/.ssh/jenkins-key
#   export AWS_PROFILE=default
#   ansible-playbook playbooks/get-jenkins-password.yml

- name: Get Jenkins unlock password
  hosts: jenkins
  gather_facts: false

  tasks:
    - name: Read initialAdminPassword
      ansible.builtin.command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_unlock
      changed_when: false
      become: true

    - name: Show unlock password
      ansible.builtin.debug:
        msg: "Jenkins unlock password: {{ jenkins_unlock.stdout }}"
