[project]
name = "deriv-backend"
version = "0.1.0"
description = "Deriv AI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyjwt",
    "cryptography",
    "python-dotenv",
    "pydantic",
    "sqlalchemy",
    "greenlet",
    "asyncpg",
    "psycopg2-binary",
    "python-multipart",
    "aiokafka>=0.10.0",
]

[tool.uv]
package = false
