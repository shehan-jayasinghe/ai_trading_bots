[project]
name = "bot-circuit"
version = "0.1.0"
description = "Deriv bot circuit runner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "tenacity>=8.2.3",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "bot_circuit" = "." }
packages = ["bot_circuit"]
