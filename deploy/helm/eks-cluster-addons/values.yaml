# Defaults — override in values-dev.yaml (from Terraform / Jenkins env).

aws-load-balancer-controller:
  enabled: true
  fullnameOverride: aws-load-balancer-controller
  replicaCount: 1
  serviceAccount:
    create: true
    name: aws-load-balancer-controller

external-dns:
  enabled: true
  fullnameOverride: external-dns
  provider:
    name: aws
  policy: sync
  serviceAccount:
    create: true
    name: external-dns
