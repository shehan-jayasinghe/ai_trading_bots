global:
  environment: dev

namespace:
  name: deriv-dev

# Skip hook on single-node dev ("Too many pods"). Fresh cluster: --set kafkaTopics.enabled=true
kafkaTopics:
  enabled: false

kafka:
  controller:
    replicaCount: 1
    persistence:
      storageClass: gp2
  broker:
    replicaCount: 1
    persistence:
      storageClass: gp2
