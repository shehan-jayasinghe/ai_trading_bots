{{- if and .Values.kafka.enabled .Values.kafkaTopics.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "deriv-kafka.fullname" . }}-kafka-topics
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: kafka-topics
    {{- include "deriv-kafka.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-topics
          image: "{{ .Values.kafkaTopics.image.registry }}/{{ .Values.kafkaTopics.image.repository }}:{{ .Values.kafkaTopics.image.tag }}"
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              BOOTSTRAP="{{ include "deriv-kafka.bootstrap" . }}"
              {{- range .Values.kafkaTopics.topics }}
              /opt/bitnami/kafka/bin/kafka-topics.sh \
                --bootstrap-server "${BOOTSTRAP}" \
                --create --if-not-exists \
                --topic {{ .name }} \
                --partitions {{ .partitions }} \
                --replication-factor 1
              echo "Topic ready: {{ .name }}"
              {{- end }}
{{- end }}
