# Default values (all environments). Override with values-dev.yaml for dev.

global:
  environment: dev
  # Bitnami subcharts deploy into this namespace (must match namespace.name)
  namespaceOverride: deriv-dev
  # Public docker.io/bitnami tags were removed; use legacy archive for pinned chart versions.
  security:
    allowInsecureImages: true

namespace:
  # Namespace is created by Ansible/Jenkins before helm upgrade --install
  create: false
  name: deriv-dev

# App secret created by Ansible before helm install (see secrets.existingSecret)
secrets:
  existingSecret: deriv-platform-app-secrets
  create: false

image:
  registry: ""
  pullPolicy: IfNotPresent
  tag: latest

backend:
  enabled: true
  replicaCount: 1
  repository: deriv-backend
  port: 8000
  env:
    HOST: "0.0.0.0"
    PORT: "8000"
    RELOAD: "false"
    KAFKA_ENABLED: "true"
    KAFKA_TOPIC_SCHEDULED: workflow.scheduled

workers:
  enabled: true
  repository: deriv-workers
  planner:
    replicaCount: 1
  executor:
    replicaCount: 1
  env:
    PLANNER_TICK_SECONDS: "30"
    DERIV_WS_ENDPOINT: wss://ws.derivws.com/websockets/v3
    CREWAI_TRACING_ENABLED: "false"

frontend:
  enabled: false
  replicaCount: 1
  repository: deriv-frontend
  port: 3000
  env:
    HOST: "0.0.0.0"
    PORT: "3000"
    # Override in values-dev; bake into image at build with NEXT_PUBLIC_BOT_BASE_URL
    NEXT_PUBLIC_BOT_BASE_URL: "http://localhost:8000"

ingress:
  enabled: false
  className: alb
  # Comma-separated ACM ARNs (app + api), set via Ansible --set from terraform output
  certificateArns: ""
  hosts:
    app: app.example.com
    api: api.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"

kafkaTopics:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 3.8.0-debian-12-r5
  topics:
    - name: workflow.scheduled
      partitions: 3
    - name: workflow.execute
      partitions: 3
    - name: workflow.run.status
      partitions: 3

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r14
  auth:
    username: deriv
    database: deriv
    existingSecret: deriv-platform-app-secrets
    secretKeys:
      userPasswordKey: POSTGRES_PASSWORD
  primary:
    persistence:
      enabled: true
      size: 8Gi
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r30
  metrics:
    enabled: false

kafka:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 3.8.0-debian-12-r5
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r30
  kraft:
    enabled: true
  controller:
    replicaCount: 1
  broker:
    replicaCount: 1
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
  metrics:
    jmx:
      enabled: false
