# Dev overrides — use: helm upgrade -f values.yaml -f values-dev.yaml

global:
  environment: dev

namespace:
  create: false
  name: deriv-dev

# Set registry after: terraform output -json ecr_repository_urls
# Example: 123456789012.dkr.ecr.us-west-1.amazonaws.com
image:
  registry: "" # REQUIRED: set via --set image.registry=... or eks.yml
  tag: latest

postgresql:
  primary:
    persistence:
      size: 8Gi
      storageClass: gp2

kafka:
  controller:
    replicaCount: 1
    persistence:
      storageClass: gp2
  broker:
    replicaCount: 1
    persistence:
      storageClass: gp2

backend:
  replicaCount: 1

workers:
  planner:
    replicaCount: 1
  executor:
    replicaCount: 1

frontend:
  enabled: true
  env:
    NEXT_PUBLIC_BOT_BASE_URL: "https://api.testenvlab.shop"

ingress:
  enabled: true
  hosts:
    app: app.testenvlab.shop
    api: api.testenvlab.shop
