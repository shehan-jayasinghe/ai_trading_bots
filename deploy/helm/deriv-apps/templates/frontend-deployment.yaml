{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deriv-apps.fullname" . }}-frontend
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: frontend
    {{- include "deriv-apps.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      {{- include "deriv-apps.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        {{- include "deriv-apps.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "deriv-apps.image" (dict "Values" .Values "repository" .Values.frontend.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          {{- include "deriv-apps.secretEnvFrom" . | nindent 10 }}
          env:
            - name: DATABASE_URL
              value: {{ include "deriv-apps.postgresql.prismaUrl" . | quote }}
            {{- range $key, $val := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deriv-apps.fullname" . }}-frontend
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: frontend
    {{- include "deriv-apps.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: frontend
    {{- include "deriv-apps.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
{{- end }}
