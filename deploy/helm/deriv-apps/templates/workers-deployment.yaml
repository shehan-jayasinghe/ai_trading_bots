{{- if .Values.workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deriv-apps.fullname" . }}-planner
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: planner
    {{- include "deriv-apps.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workers.planner.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: planner
      {{- include "deriv-apps.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: planner
        {{- include "deriv-apps.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: planner
          image: {{ include "deriv-apps.image" (dict "Values" .Values "repository" .Values.workers.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "python", "-m", "planner.main"]
          {{- include "deriv-apps.secretEnvFrom" . | nindent 10 }}
          env:
            - name: POSTGRES_DATABASE_URL
              value: {{ include "deriv-apps.postgresql.url" . | quote }}
            - name: KAFKA_BOOTSTRAP
              value: {{ include "deriv-apps.kafka.bootstrap" . | quote }}
            {{- range $key, $val := .Values.workers.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deriv-apps.fullname" . }}-executor
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: executor
    {{- include "deriv-apps.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workers.executor.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: executor
      {{- include "deriv-apps.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: executor
        {{- include "deriv-apps.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: executor
          image: {{ include "deriv-apps.image" (dict "Values" .Values "repository" .Values.workers.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "python", "-m", "executor.main"]
          {{- include "deriv-apps.secretEnvFrom" . | nindent 10 }}
          env:
            - name: POSTGRES_DATABASE_URL
              value: {{ include "deriv-apps.postgresql.url" . | quote }}
            - name: KAFKA_BOOTSTRAP
              value: {{ include "deriv-apps.kafka.bootstrap" . | quote }}
            {{- range $key, $val := .Values.workers.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
{{- end }}
