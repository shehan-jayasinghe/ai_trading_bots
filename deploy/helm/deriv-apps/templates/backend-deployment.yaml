{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deriv-apps.fullname" . }}-backend
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: backend
    {{- include "deriv-apps.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      {{- include "deriv-apps.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        {{- include "deriv-apps.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: {{ include "deriv-apps.image" (dict "Values" .Values "repository" .Values.backend.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          {{- include "deriv-apps.secretEnvFrom" . | nindent 10 }}
          env:
            - name: POSTGRES_DATABASE_URL
              value: {{ include "deriv-apps.postgresql.url" . | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "deriv-apps.kafka.bootstrap" . | quote }}
            {{- range $key, $val := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deriv-apps.fullname" . }}-backend
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: backend
    {{- include "deriv-apps.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: backend
    {{- include "deriv-apps.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
{{- end }}
