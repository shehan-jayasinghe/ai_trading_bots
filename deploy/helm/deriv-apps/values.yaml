global:
  environment: dev

namespace:
  create: false
  name: deriv-dev

secrets:
  existingSecret: deriv-platform-app-secrets

# DNS names of sibling Helm releases (deriv-postgres, deriv-kafka)
externalServices:
  postgresql:
    host: deriv-postgres-postgresql
    port: 5432
    username: deriv
    database: deriv
  kafka:
    host: deriv-kafka
    port: 9092

image:
  registry: ""
  pullPolicy: IfNotPresent
  tag: latest

backend:
  enabled: true
  replicaCount: 1
  repository: deriv-backend
  port: 8000
  env:
    HOST: "0.0.0.0"
    PORT: "8000"
    RELOAD: "false"
    KAFKA_ENABLED: "true"
    KAFKA_TOPIC_SCHEDULED: workflow.scheduled

workers:
  enabled: true
  repository: deriv-workers
  planner:
    replicaCount: 1
  executor:
    replicaCount: 1
  env:
    PLANNER_TICK_SECONDS: "30"
    DERIV_WS_ENDPOINT: wss://ws.derivws.com/websockets/v3
    CREWAI_TRACING_ENABLED: "false"

frontend:
  enabled: false
  replicaCount: 1
  repository: deriv-frontend
  port: 3000
  env:
    HOST: "0.0.0.0"
    PORT: "3000"
    NEXT_PUBLIC_BOT_BASE_URL: "http://localhost:8000"
