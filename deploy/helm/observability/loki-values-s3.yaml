# Grafana Loki (SingleBinary) with S3 object store. Substitute ${LOKI_S3_BUCKET}, ${AWS_REGION}, ${LOKI_ROLE_ARN} via envsubst.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: ${LOKI_S3_BUCKET}
      ruler: ${LOKI_S3_BUCKET}
      admin: ${LOKI_S3_BUCKET}
    s3:
      region: ${AWS_REGION}
  limits_config:
    retention_period: 168h

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: ${LOKI_ROLE_ARN}

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

test:
  enabled: false
