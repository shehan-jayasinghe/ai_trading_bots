# Dev S3 object store — requires LOKI_S3_BUCKET and LOKI_ROLE_ARN (--set from deploy script).

loki:
  loki:
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: ""
        ruler: ""
        admin: ""
      s3:
        region: us-west-1
  serviceAccount:
    create: true
    name: loki
    annotations:
      eks.amazonaws.com/role-arn: ""
  singleBinary:
    persistence:
      enabled: false
