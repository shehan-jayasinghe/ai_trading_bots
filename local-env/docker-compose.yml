# Local Kafka (KRaft) — no Zookeeper
# Docs: ../docs/architecture/infrastructure/kafka-local.md
#
# Host apps → localhost:9092
# Containers on this compose network → kafka:29092

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: ai-trading-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 60s

  kafka-init-topics:
    image: apache/kafka:3.8.1
    container_name: ai-trading-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BOOT=kafka:29092
        # Remove legacy dot-named topics (metric warning); ignore if missing
        for legacy in candles.btc candles.gold; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOT \
            --delete --topic $$legacy 2>/dev/null || true
        done
        for t in candles-btc candles-gold; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOT \
            --create --if-not-exists --topic $$t --partitions 6 --replication-factor 1
        done
        echo "Topics ready:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOT --list
    restart: "no"

volumes:
  kafka-data:
