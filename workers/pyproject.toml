[project]
name = "deriv-workers"
version = "0.1.0"
description = "Kafka planner and LangGraph executor workers"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiokafka>=0.10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "asyncpg>=0.29.0",
    "boto3>=1.43.0",
    "crewai>=0.80.0",
    "llama-index-core>=0.12.0",
]

[tool.uv]
package = false
