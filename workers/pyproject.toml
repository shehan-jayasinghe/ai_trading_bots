[project]
name = "ai-trading-workers"
version = "0.1.0"
description = "FastAPI worker pool: Binance + Deriv candle producers → Kafka"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "aiokafka>=0.12.0",
  "httpx>=0.27.0",
  "websockets>=13.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
ingest-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
